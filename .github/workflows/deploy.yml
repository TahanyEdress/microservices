name: FIP_APP
on:
  push:
    branches:
      - master
jobs:
 build_:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v2
    - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }} 
  
    - run: docker build -t tahany/client ./client
    - run: docker build -t tahany/server ./server
    - run: docker build -t tahany/nginx ./nginx 
    - run: docker build -t tahany/worker ./worker


    - run: docker push tahany/client
    - run: docker push tahany/server
    - run: docker push tahany/nginx
    - run: docker push tahany/worker

